<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>World Clock</h1>
            <p class="subtitle">Current time in different time zones</p>
        </div>
        
        <div class="timezone-selector">
            <label for="addTimezone">Add Time Zone:</label>
            <select id="addTimezone">
                <option value="">Select a timezone...</option>
            </select>
            <button id="addBtn" class="add-btn">Add</button>
        </div>
        
        <div class="clocks-container" id="clocksContainer">
            <!-- Clock cards will be added here dynamically -->
        </div>
        
        <div class="reset-section">
            <button id="resetBtn" class="reset-btn">Reset to Default</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
